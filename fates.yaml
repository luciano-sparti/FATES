version: "2"
services:
  db:
    command: "sleep 200"
    healthcheck:
      cmd: "true"
      interval_ms: 500
      timeout_ms: 2000
      retries: 5
    restart_policy:
      condition: on_failure
      max_retries: 3
      backoff_ms: 1000

  api:
    command: "sleep 150"
    depends_on:
      - db: healthy
    healthcheck:
      cmd: "true"
      interval_ms: 500
      retries: 3

  web:
    command: "sleep 100"
    depends_on:
      - api: healthy
