[package]
name = "fates-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lightweight, declarative process orchestrator for the command line."
readme = "README.md"
homepage = "https://github.com/Luciano-Sparti/FATES"
repository = "https://github.com/Luciano-Sparti/FATES"
documentation = "https://github.com/Luciano-Sparti/FATES#readme"
keywords = ["process", "orchestration", "cli", "devops", "process-management"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Luciano Sparti <luciano.sparti@proton.me>"]

# The crate is published as `fates-cli` (the name `fates` is taken on crates.io),
# but the installed binary keeps the short, memorable name `fates`.
[[bin]]
name = "fates"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.1"
crossterm = "0.29.0"
nix = { version = "0.31.3", features = ["process", "signal", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sysinfo = "0.39.6"
