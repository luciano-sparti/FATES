name: release

# Build FATES for every supported platform and attach the binaries to a
# GitHub Release. Triggered automatically when a version tag (v*) is pushed.
#
# crates.io publishing is handled by a SEPARATE manual workflow
# (.github/workflows/publish-crates.yml) so you stay in control of when the
# crate goes live — run it after the GitHub release is confirmed and the
# CARGO_REGISTRY_TOKEN secret is set.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,  name: fates-linux-x86_64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, name: fates-linux-aarch64 }
          - { os: macos-latest,  target: x86_64-apple-darwin,       name: fates-macos-x86_64 }
          - { os: macos-latest,  target: aarch64-apple-darwin,      name: fates-macos-aarch64 }
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build (aarch64 Linux, cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage uniquely-named binary
        run: cp "target/${{ matrix.target }}/release/fates" "${{ matrix.name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create GitHub Release with binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "FATES ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*/fates-*
